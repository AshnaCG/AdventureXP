<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styleDesignSystem.css">
</head>

<body>
    <header>
        <h1>Adventure Alley</h1>
    </header>

    <h1>New reservation</h1>
    <h2>Choose activity</h2>

    <div class="activities">
        <div class="activity-card">Gokart</div><br>
        <div class="activity-card">Minigolf</div><br>
        <div class="activity-card">Paintball</div><br>
        <div class="activity-card">Sumo Wrestling</div><br>
    </div><br>

    <h2>Choose date</h2><br>
    <div class="date">
        <label for="date">Date:</label>
        <input type="date" id="date" name="date"><br><br>
    </div>

    <h2>Choose time</h2><br>
    <div class="time">
        <label for="time">Time:</label>
        <input type="time" id="time" name="time"><br><br>
    </div>

    <button class="confirm">Confirm</button>
</body>

</html>
