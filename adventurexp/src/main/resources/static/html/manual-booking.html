<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>AdventureXP - Reservation</title>
    <link rel="stylesheet" href="../css/global.css">
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
    </style>
</head>
<body>

<header class="site-header">
    <a href="index.html" class="logo">Adventure Alley</a>
    <nav class="main-nav">
        <a href="index.html" data-roles="GUEST">Forside</a>
        <a href="activities.html" data-roles="GUEST">Aktiviteter</a>
        <a href="reservation.html" data-roles="GUEST">Reservér</a>
        <a href="manual-booking.html" data-roles="RESERVATION ADMIN" hidden>Reservér</a>
        <a href="employee.html" data-roles="EMPLOYEE ADMIN" hidden>Medarbejder</a>
        <a href="administrateActivities.html" data-roles="EMPLOYEE ADMIN" hidden>Administrer aktiviteter</a>
        <a href="calendar.html" data-roles="ADMIN EMPLOYEE" hidden>Kalender</a>
        <a href="admin.html" data-roles="ADMIN" hidden>Admin</a>
        <a href="users.html" data-roles="ADMIN" hidden>Brugere</a>
        <a href="login.html" class="nav-login" data-roles="GUEST">Log ind</a>
    </nav>
    <div class="user-info" hidden>
        <span>Logget ind som <strong id="header-username"></strong></span>
        <button id="header-logout" class="logout-button">Log ud</button>
    </div>
</header>

<h1>Ny reservation</h1>

<form id="reservation-form">

    <label for="type">Type</label>
    <select id="type" name="type">
        <option value="WHOLE_CENTER">Hele centret</option>
        <option value="PRIVATE">Privat</option>
    </select>

    <label for="activity">Aktivitet</label>
    <select id="activity" name="activity">
        <option value="">Ingen (hele centret)</option>

    </select>
    <label for="bookingPackage">Pakke</label>
    <select id="bookingPackage" name="bookingPackage">
        <option value="">Ingen (privat)</option>
    </select>


    <label for="participants">Antal personer</label>
    <input type="number" id="participants" name="participants" min="40" required>

    <label for="startTime">Dato og tid</label>
    <input type="datetime-local" id="startTime" name="startTime" required>

    <label for="customerName">Kundens navn</label>
    <input type="text" id="customerName" name="customerName" required>

    <label for="customerEmail">E-mail</label>
    <input type="email" id="customerEmail" name="customerEmail">

    <label for="customerPhoneNumber">Telefon</label>
    <input type="tel" id="customerPhoneNumber" name="customerPhoneNumber">

    <button type="submit">Opret reservation</button>
</form>

<p id="besked" hidden></p>

<h2>Reservationer</h2>

<table>
    <thead>
    <tr>
        <th>Dato</th>
        <th>Kunde</th>
        <th>Personer</th>
        <th>Aktivitet/pakke</th>
        <th>Pris i alt</th>
        <th>Status</th>
    </tr>
    </thead>
    <tbody id="booking-liste"></tbody>
</table>


<script src="../js/manual-booking.js"></script>
<script type="module" src="../js/header.js"></script>

</body>
</html>
