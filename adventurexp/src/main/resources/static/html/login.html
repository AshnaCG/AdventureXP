<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdventureXP - Log ind</title>
    <link rel="stylesheet" href="../css/loginCSS.css">
</head>

<body>
<header class="site-header">
    <a href="index.html" class="logo">Adventure Alley</a>
    <a href="index.html" class="back-link">← Til forsiden</a>
</header>

<main class="page-content">
    <div class="login-box">
        <span class="label">MEDARBEJDER</span>
        <h1>Log ind</h1>

        <form class="login-form">
            <p id="login-error" hidden></p>

            <label for="username">Brugernavn</label>
            <input type="text" id="username" name="username" autocomplete="username" required>

            <label for="password">Adgangskode</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit" class="login-button">LOG IND</button>
        </form>
    </div>
</main>

<script type="module" src="../js/login.js"></script>
</body>
</html>
