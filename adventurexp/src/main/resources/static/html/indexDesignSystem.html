<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/styleDesignSystem.css">
</head>

<body>
    <header>
        <h1>Adventure Alley</h1>
    </header>

    <h1>New reservation</h1>
    <h2>Choose activity</h2>

    <div class="activities" id="activities"></div>

    <h2>Choose date</h2><br>
    <div class="date">
        <label for="date">Date:</label>
        <input type="date" id="date" name="date"><br><br>
    </div>

    <h2>Choose time</h2><br>
    <div class="time">
        <label for="time">Time:</label>
        <input type="time" id="time" name="time"><br><br>
    </div>

    <form>
        <h2>
            <label for="guestname">Guest Name:</label><br>
            <input type="text" id="guestname" name="guestname"><br><br>
            <label for="guestemail">Email:</label><br>
            <input type="email" id="guestemail" name="guestemail"><br><br>
            <label for="guestphone">Phone Number:</label><br>
            <input type="tel" id="guestphone" name="guestphone"><br><br>
        </h2>
    </form>

    <button id="confirm">Confirm</button>

    <script src="../js/appDesignSystem.js"></script>

</body>

</html>
