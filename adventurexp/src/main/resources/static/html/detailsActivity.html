<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>AdventureXP Aktivitetsdetaljer</title>
    <link rel="stylesheet" href="../css/detailsActivityCSS.css">
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>

<header class="site-header">
    <a href="index.html" class="logo">Adventure Alley</a>
    <nav class="main-nav">
        <a href="index.html" data-roles="GUEST">Forside</a>
        <a href="activities.html" data-roles="GUEST">Aktiviteter</a>
        <a href="reservation.html" data-roles="GUEST">Reservér</a>
        <a href="manual-booking.html" data-roles="RESERVATION ADMIN" hidden>Reservér</a>
        <a href="employee.html" data-roles="EMPLOYEE ADMIN" hidden>Medarbejder</a>
        <a href="administrateActivities.html" data-roles="EMPLOYEE ADMIN" hidden>Administrer aktiviteter</a>
        <a href="admin.html" data-roles="ADMIN" hidden>Admin</a>
        <a href="users.html" data-roles="ADMIN" hidden>Brugere</a>
        <a href="login.html" class="nav-login" data-roles="GUEST">Log ind</a>
    </nav>
    <div class="user-info" hidden>
        <span>Logget ind som <strong id="header-username"></strong></span>
        <button id="header-logout" class="logout-button">Log ud</button>
    </div>
</header>

<div class="page-content">
    <a href="activities.html" class="back-link">← Alle aktiviteter</a>

    <p id="activity-error" hidden></p>

    <div id="activity-detail" hidden>
        <img id="activity-image" class="detail-image">

        <div class="detail-content">
            <div class="detail-text">
                <span class="label">AKTIVITET</span>
                <h1 id="activity-name"></h1>
                <p id="activity-description"></p>
            </div>
            <div class="fact-box">
                <h3>FAKTA</h3>
                <div class="fact-row">
                    <span>Varighed</span>
                    <strong id="activity-duration"></strong>
                </div>
                <div class="fact-row">
                    <span>Aldersgrænse</span>
                    <strong id="activity-age"></strong>
                </div>
                <div class="fact-row">
                    <span>Højdegrænse</span>
                    <strong id="activity-height"></strong>
                </div>

                <h4>UDSTYR</h4>
                <ul id="activity-equipment"></ul>

                <a href="reservation.html" class="book-button">BOOK</a>
            </div>
        </div>
    </div>
</div>

<script src="../js/detailsActivityJavaScript.js"></script>
<script type="module" src="../js/header.js"></script>

</body>
</html>
