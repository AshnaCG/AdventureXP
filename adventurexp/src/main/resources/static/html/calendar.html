<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Medarbejder</title>
    <link rel="stylesheet" href="../css/calender.css">
</head>

<body>

<header class="site-header">
    <a href="index.html" class="logo">Adventure Alley</a>
    <nav class="main-nav">
        <a href="index.html" data-roles="GUEST">Forside</a>
        <a href="activities.html" data-roles="GUEST">Aktiviteter</a>
        <a href="reservation.html" data-roles="GUEST">Reservér</a>
        <a href="manual-booking.html" data-roles="RESERVATION ADMIN" hidden>Reservér</a>
        <a href="employee.html" data-roles="EMPLOYEE ADMIN" hidden>Medarbejder</a>
        <a href="administrateActivities.html" data-roles="EMPLOYEE ADMIN" hidden>Administrer aktiviteter</a>
        <a href="calendar.html" data-roles="ADMIN EMPLOYEE" hidden>Kalender</a>
        <a href="admin.html" data-roles="ADMIN" hidden>Admin</a>
        <a href="users.html" data-roles="ADMIN" hidden>Brugere</a>
        <a href="login.html" class="nav-login" data-roles="GUEST">Log ind</a>
    </nav>
    <div class="user-info" hidden>
        <span>Logget ind som <strong id="header-username"></strong></span>
        <button id="header-logout" class="logout-button">Log ud</button>
    </div>
</header>

<main>
    <h1>Medarbejder</h1>
    <section id="schedule-section">

        <h2>Vagtplan</h2>

        <div id="calendar-controls">

            <button id="week-view-btn">
                Uge
            </button>

            <button id="month-view-btn">
                Måned
            </button>

        </div>


        <div id="calendar">

            <div class="time-column"></div>
        </div>

    </section>


    <aside id="shift-sidebar">

        <button id="close-sidebar">
            ×
        </button>

        <h2>Vagtinformation</h2>

        <p>
            <strong>Medarbejder:</strong>
            <span id="shift-employee"></span>
        </p>

        <p>
            <strong>Dato:</strong>
            <span id="shift-date"></span>
        </p>

        <p>
            <strong>Start:</strong>
            <span id="shift-start"></span>
        </p>

        <p>
            <strong>Slut:</strong>
            <span id="shift-end"></span>
        </p>


        <h3>Aktiviteter i vagten</h3>

        <ul id="shift-activities">
        </ul>

    </aside>


    <!-- UDSTYR -->

    <h2>Udstyr</h2>

    <table id="udstyr-tabel">

        <thead>
        <tr>
            <th>Aktivitet</th>
            <th>Udstyr</th>
            <th>I alt</th>
            <th>Ledige</th>
            <th>I stykker</th>
        </tr>
        </thead>

        <tbody>
        </tbody>

    </table>

</main>


<script type="module" src="../js/employee.js"></script>

</body>
</html>
