name: Build and test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: adventurexp

    env:
      MYSQL_DATABASE: adventurexp
      MYSQL_USER: adventurexp
      MYSQL_PASSWORD: ci_password
      MYSQL_ROOT_PASSWORD: ci_root_password
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/adventurexp
      SPRING_DATASOURCE_USERNAME: adventurexp
      SPRING_DATASOURCE_PASSWORD: ci_password
      # Frisk skema hvert CI løb i modsætning til "update" fra lokal dev.
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          # JDK har en indbygget caching funktion siden version 2. Derfor er der intet behov for Maven cache segment.
          cache: maven
          cache-dependency-path: adventurexp/pom.xml

#      - name: Cache Maven dependencies
#        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
#        with:
#          path: ~/.m2/repository
#          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
#          restore-keys: |
#            ${{ runner.os }}-maven-

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Start MySQL (Docker Compose)
        run: docker compose up -d --wait mysql

      - name: Compile and run tests
        run: ./mvnw -B verify

      - name: Stop containers
        if: always()
        run: docker compose down -v