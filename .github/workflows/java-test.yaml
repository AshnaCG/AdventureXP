name: Build and test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: adventurexp

    env:
      MYSQL_DATABASE: adventurexp
      MYSQL_USER: adventurexp
      MYSQL_PASSWORD: ci_password
      MYSQL_ROOT_PASSWORD: ci_root_password
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/adventurexp
      SPRING_DATASOURCE_USERNAME: adventurexp
      SPRING_DATASOURCE_PASSWORD: ci_password
      # Frisk skema hvert CI løb i modsætning til "update" fra lokal dev.
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

    steps:
      - name: Check out code
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2

      - name: Set up JDK
        uses: actions/setup-java@387ac29b308b003ca37ba93a6cab5eb57c8f5f93
        with:
          distribution: temurin
          java-version: '25'
          # JDK har en indbygget caching funktion siden version 2. Derfor er der intet behov for Maven cache segment.
          cache: maven
          cache-dependency-path: adventurexp/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Start MySQL (Docker Compose)
        run: docker compose up -d --wait mysql

      - name: Compile and run tests
        run: ./mvnw -B verify

      - name: Stop containers
        if: always()
        run: docker compose down -v