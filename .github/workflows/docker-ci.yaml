name: Docker CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: adventurexp

    env:
      MYSQL_DATABASE: adventurexp
      MYSQL_USER: adventurexp
      MYSQL_PASSWORD: ci_password
      MYSQL_ROOT_PASSWORD: ci_root_password
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/adventurexp
      SPRING_DATASOURCE_USERNAME: adventurexp
      SPRING_DATASOURCE_PASSWORD: ci_password
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build and start containers
        run: docker compose up -d --build

      # Tester for spring actuator endpoint 'health'
      - name: Check application health
        run: curl -f --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/actuator/health

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v