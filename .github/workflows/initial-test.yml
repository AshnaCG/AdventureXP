name: Build and test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: adventurexp

    env:
      MYSQL_DATABASE: adventurexp
      MYSQL_USER: adventurexp
      MYSQL_PASSWORD: ci_password
      MYSQL_ROOT_PASSWORD: ci_root_password
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/adventurexp
      SPRING_DATASOURCE_USERNAME: adventurexp
      SPRING_DATASOURCE_PASSWORD: ci_password
      SPRING_PROFILES_ACTIVE: mysql
      # Fresh schema every CI run, unlike the "update" used for local dev.
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: adventurexp/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Start MySQL (Docker Compose)
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d mysql

      - name: Compile and run tests
        run: ./mvnw -B verify

      - name: Stop containers
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down -v